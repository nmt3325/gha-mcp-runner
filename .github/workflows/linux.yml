name: linux

# workflow_dispatch ONLY. Adding pull_request / pull_request_target / issue_comment
# here would break the property that makes this repository safe to keep public.
# `runs-on` is a literal on purpose: injecting it from an input turns a typo into a
# job that queues forever.

on:
  workflow_dispatch:
    inputs:
      env_id:
        description: Broker-generated environment id
        required: true
      ttl_minutes:
        description: Lease length in minutes
        required: false
        default: "60"

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-agent
        with:
          env_id: ${{ inputs.env_id }}
          ttl_minutes: ${{ inputs.ttl_minutes }}
          broker_url: ${{ secrets.BROKER_URL }}
          broker_secret: ${{ secrets.BROKER_SECRET }}
          gh_pat: ${{ secrets.GH_PAT }}
